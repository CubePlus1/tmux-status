name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    steps:
      - name: Require Codex credential
        env:
          CODEX_REVIEW_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$CODEX_REVIEW_KEY" ]; then
            echo "OPENAI_API_KEY is not configured; Codex review is blocked and must not be required." >&2
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run read-only Codex review
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review.md
          output-schema-file: .github/codex/review-schema.json
          output-file: codex-review.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Enforce Codex verdict
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("codex-review.json").read_text(encoding="utf-8"))
          print(result.get("summary", "Codex review completed"))
          if result.get("verdict") != "pass":
              for finding in result.get("findings", []):
                  print(f"- {finding}")
              raise SystemExit("Codex review reported blocking findings")
          PY
